version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # Jahia parent / platform artifacts define the target Jahia version
      - dependency-name: "org.jahia.*"
      # OSGi spec artifacts change Require-Capability / Import-Package ranges (Jahia 8.2 ships DS 1.4)
      - dependency-name: "org.osgi:*"
      # frontend-maven-plugin 2.x needs a Java 17 Maven runtime
      - dependency-name: "com.github.eirslett:frontend-maven-plugin"
        update-types: ["version-update:semver-major"]
      # slugify 3+/4 is Java 17 bytecode with a new API (embedded in a Java 11 bundle)
      - dependency-name: "com.github.slugify:slugify"
        update-types: ["version-update:semver-major"]
      # JUnit 6 requires Java 17
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.junit:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/javascript"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Shared libraries / platform-aligned majors
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      tests-dependencies:
        patterns:
          - "*"
    ignore:
      # cross-fetch >= 3.2.0 hands back an unbound window.fetch; under @jahia/cypress 7 the e2e
      # GraphQL calls then fail with "TypeError: Illegal invocation" (2026-11 e2e runs). Stay on
      # 3.1.x until this harness moves to @jahia/cypress 8, where cross-fetch 4 works.
      - dependency-name: "cross-fetch"
        versions: [">=3.2.0"]
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
